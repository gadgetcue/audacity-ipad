name: iOS (iPad + iPhone)

on:
  push:
    branches: [ios, ios-pipeline-stub]
  pull_request:
    paths: ["ios/**", "crates/**", "Cargo.*", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ios-cargo-
      - name: Tools
        run: brew install xcodegen
      - name: Build Rust and generate the Xcode project
        run: ios/build.sh
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/SoundCue.xcodeproj -scheme SoundCue -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60
      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild -project ios/SoundCue.xcodeproj -scheme SoundCue -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60
      - name: Package unsigned .ipa
        run: ios/ci/package_ipa.sh build/dev/Build/Products/Release-iphoneos/SoundCue.app out/SoundCue-unsigned.ipa
      - name: Sign .ipa (only when Apple certificate secrets are set)
        if: env.IOS_CERT_P12_BASE64 != '' && env.IOS_PROFILE_BASE64 != ''
        run: |
          cp -R build/dev/Build/Products/Release-iphoneos/SoundCue.app out/SoundCue.app
          ios/ci/sign.sh out/SoundCue.app
          ios/ci/package_ipa.sh out/SoundCue.app out/SoundCue.ipa
          rm -rf out/SoundCue.app
      - name: Simulator smoke test (iPhone + iPad)
        run: ios/ci/sim_smoke.sh build/sim/Build/Products/Release-iphonesimulator/SoundCue.app out/qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SoundCue-ios
          path: out/
          if-no-files-found: warn
