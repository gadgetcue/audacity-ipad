# XcodeGen spec for the SoundCue iOS/iPadOS app. Generate with: xcodegen generate (from ios/)
name: SoundCue
options:
  bundleIdPrefix: com.gadgetcue
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  SoundCue:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SoundCue
        CFBundleName: SoundCue
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarHidden: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: SoundCue records audio from the microphone when you press Record.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gadgetcue.soundcue
        PRODUCT_NAME: SoundCue
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(PROJECT_DIR)/build/rust/device"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(PROJECT_DIR)/build/rust/sim"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ARCHS: arm64
        OTHER_LDFLAGS: ["-lsoundcue_ios", "-lc++", "-lresolv"]
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMedia.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreText.framework
